name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: windows-x64, runner: windows-2022, platform: win, arch: x64 }
          - { profile: win7-x64, runner: windows-2022, platform: win, arch: x64 }
          - { profile: linux-x64, runner: ubuntu-22.04, platform: linux, arch: x64 }
          - { profile: linux-arm64, runner: ubuntu-22.04-arm, platform: linux, arch: arm64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
      npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
      npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            build/win7/package-lock.json
      - name: Use locked npm
        run: npm install --global npm@9.6.5
      - name: Prepare isolated profile
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          node scripts/release-profile.js '${{ matrix.profile }}' "$VERSION"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Validate release configuration
        run: npm run release:test
      - name: Install Electron and rebuild native modules
        run: |
          node node_modules/electron/install.js
          node scripts/install-app-deps.js
      - name: Linux desktop libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libsecret-1-0 libfuse2 xvfb dbus-x11 gnome-keyring
      - name: Native ARM64 deb packaging tool
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm -v 1.15.1 --no-document
          echo 'USE_SYSTEM_FPM=true' >> "$GITHUB_ENV"
      - name: Verify runtime on Windows runner
        if: matrix.platform == 'win'
        timeout-minutes: 5
        run: |
          ELECTRON_RUN_AS_NODE=1 node_modules/.bin/electron scripts/test-release-runtime.js
          npm run selftest
          npm run smoke
      - name: Verify runtime on Linux runner
        if: matrix.platform == 'linux'
        timeout-minutes: 5
        run: |
          ELECTRON_RUN_AS_NODE=1 node_modules/.bin/electron scripts/test-release-runtime.js
          # Hosted Linux runners 没有可解锁的用户 Secret Service；安全存储本身已在
          # Windows/Win7 selftest 覆盖，Linux 这里执行 Electron/驱动启动级检查。
      - name: Build installers and update manifests
        run: |
          if [[ '${{ matrix.platform }}' == win ]]; then
            npx --no-install electron-builder --config build/electron-builder.cjs --win nsis zip --x64 --publish never
          else
            npx --no-install electron-builder --config build/electron-builder.cjs --linux --${{ matrix.arch }} --publish never
          fi
      - name: Validate hashes and stage distributable assets
        run: node scripts/release-assets.js stage ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.profile }}
          path: release/staged/*
          if-no-files-found: error
  publish:
    name: Publish complete release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify matrix and generate download index
        run: node scripts/release-assets.js publish "${GITHUB_REF_NAME#v}"
      - name: Refuse overwriting an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release/state.json; then
            node -e "if (!require('./release/state.json').isDraft) throw Error('Published releases are immutable; use a new version tag')"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DBPanda ${{ github.ref_name }}
          body_path: release/RELEASE-NOTES.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/DBPanda-Setup.exe
            release/DBPanda-Setup.zip
            release/DBPanda-Setup.exe.blockmap
            release/DBPanda-Win7-x64-Setup.exe
            release/DBPanda-Win7-x64-Setup.zip
            release/DBPanda-Win7-x64-Setup.exe.blockmap
            release/DBPanda-Linux-x64.AppImage
            release/DBPanda-Linux-x64.deb
            release/DBPanda-Linux-arm64.AppImage
            release/DBPanda-Linux-arm64.deb
            release/latest.yml
            release/win7.yml
            release/latest-linux.yml
            release/latest-linux-arm64.yml
            release/SHA256SUMS.txt
            release/downloads.json
      - name: Make the fully uploaded release visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
